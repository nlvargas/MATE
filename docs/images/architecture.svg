<text x="960.0" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">upload roster / run solve</text><line x1="960.0" y1="270" x2="960.0" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/><line x1="960.0" y1="400" x2="960" y2="500.0" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/><polyline points="810.0,560 660.0,560 660.0,700" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="660.0" y="552" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">yes: small roster (sync path)</text><line x1="960" y1="620.0" x2="960.0" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="960.0" y="652.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">no: large roster (async path)</text><polyline points="530.0,735.0 120,735.0 120,75.0 530.0,75.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>

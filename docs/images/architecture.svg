<svg viewBox="0 0 1320 1260" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="MATE architecture: a React single-page app talks to an AWS deployment (API Gateway, Lambda, S3) behind Zappa; small rosters solve synchronously with CP-SAT and return JSON directly, while large rosters are packaged and sent over SSH to a university Slurm cluster for a headless Gurobi batch solve, ending in an emailed results spreadsheet." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
